apiVersion: v1
kind: ConfigMap
metadata:
  name: inspector-secret
  namespace: {{ .Values.namespace }}
data:
  SMTP_HOST: {{ .Values.smtp.host | quote }}
  SMTP_PORT: {{ .Values.smtp.port | quote }}
  SMTP_USER: {{ .Values.smtp.user | quote }}
  SMTP_PASS: {{ .Values.smtp.password | quote }}
  MAIL_TO: {{ .Values.smtp.mailTo | quote }}
